
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body class="registration-body">
    
    <main class="login-main">
      <div class="form-container login_container">
        <div class="login-container">
          <h3>LOGIN</h3>
          <form>
            <input type="text"  placeholder="EMAIL " id="login-email"/><br>
            <p id="loginEmailError" class="error-msg"></p>
            <input type="password"  placeholder="PASSWORD"  id="login-password"/>
            <p id="loginPasswordError" class="error-msg"></p>
            <p id="forgor"><a href="">Forgot Password?</a></p>
            <button id="login-btn" type="submit"  class="form-btns">LOG IN</button>
            <p id="acc"><a>Don't have an account yet?</a></p>
            <button type="button" id="create-id" class="form-btns toggle">
              Create Tech ID<span class="green">></span>
            </button>
          </form>
        </div>
      </div>

      <div class="form-container signup_container off">
        <div class="signup-container">
          <div class="top-text">
            <h3 class="create-account-h3">CREATE RAZER ID ACCOUNT</h3>
            <p id="tekk-id">
              Tekk ID is a unified account for all TEKK devices
            </p>
          </div>
          <form onsubmit="event.preventDefault(); validateForm();">
            <p id="usernameError" class="error-msg"></p>
            <input
              type="text" 
              placeholder="TECH ID (your name)" id="username-input"
            />
            <select class="form-btns">
              <option value="">Location</option>
              <option value="Afghanistan">Afghanistan</option>
              <option value="Aland Islands">Aland Islands</option>
              <option value="Albania">Albania</option>
              <option value="Algeria">Algeria</option>
              <option value="American Samoa">American Samoa</option>
              <option value="Andorra">Andorra</option>
              <option value="Angola">Angola</option>
              <option value="Anguilla">Anguilla</option>
              <option value="Antartica">Antartica</option>
              <option value="Antigua and Barbuda">Antigua and Barbuda</option>
              <option value="Argentina">Argentina</option>
              <option value="Armenia">Armenia</option>
              <option value="Aruba">Aruba</option>
              <option value="Australia">Australia</option>
              <option value="Austria">Austria</option>
            </select>
            <input class="input-container" type="date"  />
            <p id="emailError" class="error-msg"></p>
            <input type="text" placeholder="EMAIL ADDRESS"  id="email-input"/>
            <p id="passwordError" class="error-msg"></p>
            <input type="password" placeholder="PASSWORD" id="password-input"/>
            <div class="isadmin">
              <label for="" id="admin">Is Administrator</label>
              <input type="checkbox" id="admin-check"/>
            </div>

            <button type="submit"  class="form-btns">Sign in</button>
            <button type="button" class="form-btns toggle">Already have an account?</button>
          </form>
        </div>
      </div>
    </main>
    <script>
      const formToggle = document.querySelectorAll(".toggle");
      const containers = document.querySelectorAll(".container");
      const loginContainer = document.querySelector(".login_container");
      const signupContainer = document.querySelector(".signup_container");

      formToggle.forEach((btn) => {
        btn.addEventListener("click", () => {
          const parent = btn.parentElement.parentElement;
          if (parent.className == "login-container") {
            loginContainer.classList.toggle("off");
            signupContainer.classList.remove("off");
          } else {
            loginContainer.classList.toggle("off");
            signupContainer.classList.toggle("off");
          }
        });
      });


    
    </script>
    <script src="validation.js"></script>
  </body>
</html>
